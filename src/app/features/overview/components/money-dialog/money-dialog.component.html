<dialog #dialog aria-labelledby="money-title" (cancel)="$event.preventDefault(); dismiss.emit()"
  class="w-[min(960px,calc(100vw-32px))] max-h-[88dvh] overflow-auto border border-border rounded-2xl p-6 bg-bg text-text shadow-2xl backdrop:bg-black/60 backdrop:backdrop-blur-sm">
  <header class="flex justify-between gap-5 items-start">
    <div>
      <h2 id="money-title" class="text-xl font-bold m-0">Movimientos del bank</h2>
      <p class="text-xs text-text-muted mt-1">Registra lo que mueves entre tus casas y tu cuenta.</p>
    </div>
    <button class="secondary !px-3 !py-1 text-sm rounded-full" autofocus (click)="dismiss.emit()" aria-label="Cerrar movimientos">
      ✕
    </button>
  </header>
  <div class="tabs my-4">
    <button [class.selected]="tab() === 'new'" (click)="tab.set('new')">
      Registrar y confirmar</button
    ><button [class.selected]="tab() === 'history'" (click)="tab.set('history')">Historial</button>
  </div>
  @if (vm.error()) {
    <p role="alert" class="alert">{{ vm.error() }}</p>
  }
  @if (vm.notice()) {
    <p role="status" class="notice">{{ vm.notice() }}</p>
  }
  <div [hidden]="tab() !== 'new'"><app-confirmations-page /></div>
  <div [hidden]="tab() !== 'history'"><app-transactions-page /></div>
</dialog>
