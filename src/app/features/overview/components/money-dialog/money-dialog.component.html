<dialog #dialog aria-labelledby="money-title" (cancel)="$event.preventDefault(); dismiss.emit()"
  class="w-[min(960px,calc(100vw-32px))] max-h-[88dvh] overflow-auto border border-border rounded-2xl p-5 sm:p-7 md:p-8 bg-bg text-text shadow-2xl backdrop:bg-black/75 backdrop:backdrop-blur-sm">
  <header class="flex justify-between gap-5 items-start">
    <div>
      <h2 id="money-title" class="text-xl sm:text-2xl font-bold m-0 tracking-tight">Movimientos del bank</h2>
      <p class="text-xs text-text-muted mt-1">Registra lo que mueves entre tus casas y tu cuenta.</p>
    </div>
    <button class="secondary !w-8 !h-8 !p-0 rounded-full grid place-items-center cursor-pointer hover:rotate-90 hover:border-accent hover:text-accent transition-all duration-200 active:scale-95 text-sm" autofocus (click)="dismiss.emit()" aria-label="Cerrar movimientos">
      ✕
    </button>
  </header>
  <div class="pill-group my-5" role="tablist">
    <button 
      type="button"
      role="tab"
      class="pill-option text-xs py-2 px-4"
      [class.selected]="tab() === 'new'" 
      [attr.aria-selected]="tab() === 'new'"
      (click)="tab.set('new')"
    >
      Registrar y confirmar
    </button>
    <button 
      type="button"
      role="tab"
      class="pill-option text-xs py-2 px-4"
      [class.selected]="tab() === 'history'" 
      [attr.aria-selected]="tab() === 'history'"
      (click)="tab.set('history')"
    >
      Historial
    </button>
  </div>
  @if (vm.error()) {
    <p role="alert" class="alert">{{ vm.error() }}</p>
  }
  @if (vm.notice()) {
    <p role="status" class="notice">{{ vm.notice() }}</p>
  }
  <div [hidden]="tab() !== 'new'"><app-confirmations-page /></div>
  <div [hidden]="tab() !== 'history'"><app-transactions-page /></div>
</dialog>
