<dialog #dialog (cancel)="dismiss.emit()" aria-labelledby="review-title"
  class="bg-surface text-text border border-border rounded-2xl p-7 w-[min(440px,calc(100vw-32px))] max-h-[85dvh] overflow-y-auto shadow-2xl backdrop:bg-black/75 backdrop:backdrop-blur-sm">
  <form method="dialog" (submit)="$event.preventDefault(); confirm.emit()">
    <span class="eyebrow text-xs font-bold text-accent tracking-widest uppercase">REVISA LOS DATOS</span>
    <h2 id="review-title" class="text-2xl font-bold my-3 text-text">{{ title() }}</h2>
    <p class="text-sm text-text-muted">{{ message() }}</p>
    <div class="review-amount my-5 p-5 bg-surface-high/30 border border-border rounded-xl text-2xl font-semibold text-text">{{ amount() }}</div>
    <small class="block text-xs text-text-muted leading-relaxed whitespace-pre-line">{{ note() }}</small>
    @if (error()) {
      <div class="alert mt-4" role="alert">{{ error() }}</div>
    }
    <div class="dialog-actions flex gap-3 mt-6 justify-end">
      <button
        type="button"
        class="secondary"
        [disabled]="busy()"
        (click)="dismiss.emit()"
        autofocus
      >
        Volver</button
      ><button class="primary" [disabled]="busy()">
        {{ busy() ? 'Guardando…' : confirmLabel() }}
      </button>
    </div>
  </form>
</dialog>
